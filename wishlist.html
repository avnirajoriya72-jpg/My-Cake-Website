<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist — Fantasy Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="Style.css">
</head>
<body style="background:#f7f3ef;">

<!-- HEADER -->
<header class="header-main">
    <div class="nav-wrapper">
        <div class="logo-area">
            <a href="Home.html"><img src="Fantasy_Logo_135x.png" class="logo-img" alt="logo"></a>
        </div>
        <div class="search-area">
            <div class="search-bar">
                <input type="text" id="wl-search" placeholder="Search wishlist...">
                <button class="search-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>
        <div class="actions-area">
            <div class="user-auth">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <div class="auth-text">
                    <a href="#">Sign In</a> <span>/</span> <a href="#">Register</a>
                </div>
            </div>
            <div class="icon-item" onclick="window.location.href='wishlist.html'" style="cursor:pointer">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7a3b12" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span class="badge wish-badge">0</span>
            </div>
            <div class="icon-item wl-cart-icon" style="cursor:pointer">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                <span class="badge cart-badge">0</span>
            </div>
        </div>
    </div>
</header>

<!-- NAVBAR -->
<nav class="navbar navbar-dark navbar-expand-lg custom-nav">
    <div class="container-fluid px-0">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="cake.html">Cake</a></li>
                <li class="nav-item"><a class="nav-link" href="cookies.html">Cookies</a></li>
                <li class="nav-item"><a class="nav-link" href="combos.html">Combos</a></li>
                <li class="nav-item"><a class="nav-link" href="shop.html">Shop By Occasion</a></li>
                <li class="nav-item"><a class="nav-link" href="Wedding.html">Wedding</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="wl-page-header">
    <div class="wl-page-header-inner">
        <div>
            <h1 class="wl-title">❤️ My Wishlist</h1>
            <p class="wl-subtitle" id="wl-count-text">Loading...</p>
        </div>
        <div class="wl-header-actions">
            <button class="wl-add-all-btn" id="wl-add-all" onclick="addAllToCart()">
                🛒 Add All to Cart
            </button>
            <button class="wl-clear-btn" onclick="clearWishlist()">
                🗑️ Clear All
            </button>
        </div>
    </div>
</div>

<!-- WISHLIST GRID -->
<div class="wl-container">
    <div class="wl-grid" id="wl-grid"></div>
    <div class="wl-empty" id="wl-empty" style="display:none">
        <div class="wl-empty-icon">💔</div>
        <h2>Your wishlist is empty</h2>
        <p>Save your favourite cakes here and order them anytime!</p>
        <a href="cake.html" class="wl-shop-btn">Browse Cakes</a>
    </div>
</div>

<!-- CART DRAWER (injected by script.js) -->
<div id="fb-toast"></div>

<script src="wishlist.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
